# Local development profile.
app:
  db:
    # Convenience for a fresh machine only; production never creates databases implicitly.
    create-database: true
  seed:
    # Inserts demo owners, hostels, residents and payments when the database has no owners yet.
    # Never modifies or deletes existing data.
    enabled: ${DEV_SEED_ENABLED:true}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:superadmin@hostelhub.dev}
    password: ${SUPER_ADMIN_PASSWORD:Admin@12345}

logging:
  level:
    com.hostelmanagement: DEBUG
